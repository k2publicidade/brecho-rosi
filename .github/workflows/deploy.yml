name: Deploy to Hostinger

on:
  push:
    branches:
      - Final
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install Dependencies
        run: npm ci

      - name: 🔑 Create .env file
        run: |
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_ADMIN_EMAILS=${{ secrets.VITE_ADMIN_EMAILS }}" >> .env

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🔍 Resolve FTP Server IP
        run: |
          echo "Resolving IP for ${{ secrets.FTP_SERVER }}..."
          nslookup ${{ secrets.FTP_SERVER }} || echo "nslookup failed"
          getent hosts ${{ secrets.FTP_SERVER }} || echo "getent failed"

      - name: 📂 Sync files via lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "set ftp:ssl-allow no; set net:timeout 20; set net:max-retries 2; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}'; mirror -R -v --parallel=2 ./dist ./public_html"
