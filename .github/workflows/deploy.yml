name: Deploy to Hostinger

on:
  push:
    branches:
      - Final
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Install Dependencies
        run: npm ci

      - name: 🔑 Create .env file
        run: |
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_ADMIN_EMAILS=${{ secrets.VITE_ADMIN_EMAILS }}" >> .env

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🔍 Resolve FTP Server IP
        run: |
          echo "Resolving IP for ${{ secrets.FTP_SERVER }}..."
          nslookup ${{ secrets.FTP_SERVER }} || echo "nslookup failed"
          getent hosts ${{ secrets.FTP_SERVER }} || echo "getent failed"

      - name: 🔍 Check FTP Ports
        env:
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          echo "Checking FTP ports on ${{ secrets.FTP_SERVER }}..."
          nc -zv ${{ secrets.FTP_SERVER }} 21 || echo "Port 21 unreachable"
          nc -zv ${{ secrets.FTP_SERVER }} 990 || echo "Port 990 unreachable"
          nc -zv ${{ secrets.FTP_SERVER }} 65002 || echo "Port 65002 unreachable"
          nc -zv ${{ secrets.FTP_SERVER }} $FTP_PORT || echo "Port $FTP_PORT unreachable"

      - name: 📂 Sync files via lftp
        env:
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_SSL: ${{ secrets.FTP_SSL || 'false' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -c "set dns:order 'inet'; set ftp:ssl-allow ${FTP_SSL}; set ftp:ssl-force ${FTP_SSL}; set ftp:ssl-protect-data ${FTP_SSL}; set ftp:passive-mode true; set net:timeout 20; set net:max-retries 2; open -p ${FTP_PORT} -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}'; mirror -R -v --parallel=2 ./dist ./public_html"
